<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能电商导购Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .workflow-badge {
            display: inline-flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .panel h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .message {
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            text-align: right;
        }
        
        .message-user .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: inline-block;
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            max-width: 80%;
            word-break: break-word;
        }
        
        .message-bot .bubble {
            background: white;
            border: 1px solid #e0e0e0;
            display: inline-block;
            padding: 12px 16px;
            border-radius: 18px 18px 18px 4px;
            max-width: 90%;
            word-break: break-word;
        }
        
        .message-bot .bubble h1,
        .message-bot .bubble h2,
        .message-bot .bubble h3 {
            font-size: 1rem;
            margin: 8px 0;
        }
        
        .message-bot .bubble strong {
            color: #667eea;
        }
        
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .chat-input:focus {
            border-color: #667eea;
        }
        
        .btn-send {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .quick-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        
        .quick-btn {
            padding: 6px 14px;
            background: #f0f0f0;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .quick-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .status-bar {
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 10px;
            display: none;
        }
        
        .status-bar.active {
            display: block;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-height: 560px;
            overflow-y: auto;
        }
        
        .product-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid #eee;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        
        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e74c3c;
        }
        
        .product-original {
            font-size: 0.8rem;
            color: #999;
            text-decoration: line-through;
            margin-left: 4px;
        }
        
        .product-rating {
            font-size: 0.85rem;
            color: #f39c12;
        }
        
        .product-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        
        .tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: #667eea20;
            color: #667eea;
            border-radius: 10px;
        }
        
        .tag.hot {
            background: #e74c3c20;
            color: #e74c3c;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.7;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 智能电商导购Agent</h1>
            <p>基于LangGraph多Agent架构，为您精准推荐最优商品</p>
            <div class="workflow-badge">
                <span class="badge"> 意图识别</span>
                <span class="badge"> 商品检索</span>
                <span class="badge"> 智能排序</span>
                <span class="badge"> 生成回复</span>
            </div>
        </div>
        
        <div class="main-content">
            <div class="panel">
                <h2>💬 智能对话</h2>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="sendQuick('我想买手机，5000左右，拍照好')"> 求推荐手机</button>
                    <button class="quick-btn" onclick="sendQuick('iPhone 15和华为Mate60哪个好')"> 手机对比</button>
                    <button class="quick-btn" onclick="sendQuick('有什么性价比高的耳机')"> 推荐耳机</button>
                    <button class="quick-btn" onclick="sendQuick('MacBook和联想笔记本选哪个')"> 笔记本对比</button>
                    <button class="quick-btn" onclick="sendQuick('最近有什么优惠活动')"> 优惠活动</button>
                </div>
                <div class="status-bar" id="statusBar"> Agent正在思考...</div>
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message message-bot">
                            <div class="bubble">
                                 您好！我是您的智能导购助手！<br><br>
                                我可以帮您：<br>
                                 <strong>搜索商品</strong> - 找到您想要的数码产品<br>
                                 <strong>智能比价</strong> - 对比多款商品价格<br>
                                 <strong>个性推荐</strong> - 根据需求推荐最适合的<br>
                                 <strong>售后咨询</strong> - 解答退换货、保修问题<br><br>
                                请问您想购买什么商品？
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" class="chat-input" id="chatInput" 
                               placeholder="输入您的购物需求...（如：推荐一款5000元左右的拍照手机）"
                               onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>📦 推荐商品</h2>
                <div class="products-grid" id="productsGrid">
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <p>在左侧输入购物需求<br>我将为您推荐最合适的商品</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            Powered by LangGraph + Qwen + FastAPI | 智能电商导购Agent v1.0
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBar = document.getElementById('statusBar');
        const productsGrid = document.getElementById('productsGrid');
        
        let threadId = null;
        
        function sendQuick(text) {
            chatInput.value = text;
            sendMessage();
        }
        
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            // 添加用户消息
            addMessage(message, 'user');
            chatInput.value = '';
            
            // 显示状态
            statusBar.classList.add('active');
            sendBtn.disabled = true;
            
            // 添加打字指示器
            const typingId = addTypingIndicator();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        thread_id: threadId 
                    })
                });
                
                const data = await response.json();
                
                // 移除打字指示器
                removeTypingIndicator(typingId);
                
                // 添加机器人回复
                if (data.response) {
                    addMessage(data.response, 'bot');
                }
                
                // 更新商品列表
                if (data.products && data.products.length > 0) {
                    updateProducts(data.products);
                }
                
                // 保存thread_id
                if (!threadId) {
                    threadId = data.thread_id;
                }
                
                // 显示执行信息
                console.log('执行日志:', data.execution_log);
                console.log('意图:', data.intent);
                console.log('执行时间:', data.execution_time + 's');
                
            } catch (error) {
                removeTypingIndicator(typingId);
                addMessage('抱歉，服务暂时不可用，请稍后重试。', 'bot');
                console.error('Error:', error);
            } finally {
                statusBar.classList.remove('active');
                sendBtn.disabled = false;
            }
        }
        
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message message-${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (sender === 'bot') {
                // 先HTML转义防截断，再解析markdown
                let html = text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');
                bubble.innerHTML = html;
            } else {
                bubble.textContent = text;
            }
            div.appendChild(bubble);
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message message-bot';
            div.innerHTML = `
                <div class="bubble">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
        
        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        function updateProducts(products) {
            if (!products || products.length === 0) return;
            
            productsGrid.innerHTML = '';
            
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                const discount = Math.round(p.discount_rate * 100);
                const isHot = p.sales_count > 50000;
                
                card.innerHTML = `
                    <div class="product-title">${p.title}</div>
                    <div class="product-meta">
                        <span>
                            <span class="product-price">¥${p.price}</span>
                            <span class="product-original">¥${p.original_price}</span>
                        </span>
                        <span class="product-rating">⭐ ${p.rating}</span>
                    </div>
                    <div class="product-tags">
                        <span class="tag">${p.brand}</span>
                        <span class="tag">${p.category}</span>
                        ${isHot ? '<span class="tag hot">🔥 热销</span>' : ''}
                        ${discount < 90 ? `<span class="tag hot">-${100-discount}%</span>` : ''}
                    </div>
                `;
                
                productsGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
