<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能电商导购Agent v4.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:24px;text-align:center}
.header h1{font-size:28px;margin-bottom:8px}
.header p{opacity:.9;font-size:14px}
.mode-toggle{position:absolute;top:28px;right:28px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:12px;backdrop-filter:blur(10px)}
.main{display:flex;height:calc(100vh - 140px)}
.chat-panel{flex:1;display:flex;flex-direction:column;padding:20px;border-right:1px solid #eee}
.products-panel{width:360px;padding:20px;overflow-y:auto;background:#f8f9fa}
.chat-messages{flex:1;overflow-y:auto;margin-bottom:16px;padding:10px}
.message{margin-bottom:16px;padding:14px 18px;border-radius:16px;max-width:85%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.user-message{background:#667eea;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.ai-message{background:#f0f0f0;color:#333;margin-right:auto;border-bottom-left-radius:4px;white-space:pre-line}
.product-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .2s}
.product-card:hover{transform:translateY(-2px)}
.product-title{font-size:14px;font-weight:600;margin-bottom:8px;color:#333}
.product-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.product-price{color:#e74c3c;font-weight:700;font-size:16px}
.product-rating{color:#f39c12}
.product-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{background:#e8f0fe;color:#1967d2;padding:2px 8px;border-radius:12px;font-size:11px}
.input-area{display:flex;gap:10px}
input[type="text"]{flex:1;padding:14px 18px;border:2px solid #e0e0e0;border-radius:12px;font-size:14px;outline:none;transition:border-color .3s}
input[type="text"]:focus{border-color:#667eea}
button{padding:14px 24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;transition:transform .2s}
button:hover{transform:scale(1.05)}
.loading{display:none;text-align:center;padding:20px;color:#667eea}
.spinner{border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.quick-buttons{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.quick-btn{padding:6px 12px;background:#e8f0fe;color:#1967d2;border:none;border-radius:16px;cursor:pointer;font-size:12px}
.quick-btn:hover{background:#d2e3fc}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;color:#333;display:flex;align-items:center;gap:8px}
.dev-panel{display:none;width:380px;padding:20px;border-left:2px solid #667eea;background:#f8f9fa;overflow-y:auto}
.dev-panel.active{display:block}
.dev-section{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dev-title{font-size:14px;font-weight:700;margin-bottom:12px;color:#667eea}
.dev-btn{padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-right:8px;margin-bottom:8px}
.dev-btn:hover{background:#5a6fd6}
.monitor-log{background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:6px;font-family:'Courier New',monospace;font-size:11px;height:200px;overflow-y:auto;line-height:1.6}
.log-entry{margin-bottom:4px;padding:2px 0;border-bottom:1px solid #333}
.response-content{background:#f5f5f5;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;line-height:1.6;max-height:300px;overflow-y:auto;white-space:pre-line}
.footer{text-align:center;padding:16px;background:#f8f9fa;color:#666;font-size:12px;border-top:1px solid #eee}
</style>
<base target="_blank">
</head>
<body>
<div class="container">
<div class="header">
<h1>🛒 智能电商导购Agent v4.0</h1>
<p>LangGraph + Qwen + FastAPI | 实时流式响应 | 智能意图识别</p>
<button class="mode-toggle" onclick="toggleDevMode()">开发者模式</button>
</div>
<div class="main" id="mainArea">
<div class="chat-panel">
<div class="quick-buttons">
<button class="quick-btn" onclick="sendQuick('推荐学生党手机，预算2000元')">学生党手机</button>
<button class="quick-btn" onclick="sendQuick('你们这最贵的产品')">最贵的产品</button>
<button class="quick-btn" onclick="sendQuick('适合给孩子买的商品')">给孩子买的</button>
<button class="quick-btn" onclick="sendQuick('最便宜的耳机')">便宜耳机</button>
<button class="quick-btn" onclick="sendQuick('iPhone和华为哪个好')">手机对比</button>
</div>
<div class="chat-messages" id="chatMessages"></div>
<div class="loading" id="loading">
<div class="spinner"></div>
<div>正在思考中...</div>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="输入您的购物需求，例如：推荐一款拍照好的手机..." onkeypress="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">发送</button>
</div>
</div>
<div class="products-panel" id="productsPanel">
<div class="section-title">📦 推荐商品</div>
<div id="productsList"></div>
</div>
<div class="dev-panel" id="devPanel">
<div class="dev-section">
<div class="dev-title">批量测试</div>
<button class="dev-btn" onclick="startBatchTest(5)">5条快速测试</button>
<button class="dev-btn" onclick="startBatchTest(10)">10条标准测试</button>
<button class="dev-btn" onclick="startBatchTest(20)">20条完整测试</button>
</div>
<div class="dev-section">
<div class="dev-title">实时监控</div>
<div class="monitor-log" id="monitorLog"></div>
</div>
<div class="dev-section">
<div class="dev-title">Agent回复内容</div>
<div class="response-content" id="responseContent">点击批量测试后，此处显示各测试用例的系统生成内容...</div>
</div>
<div class="dev-section">
<div class="dev-title">综合分析报告</div>
<div class="response-content" id="analysisContent">点击批量测试后，此处显示综合分析报告...</div>
</div>
</div>
</div>
<div class="footer">LangGraph + Qwen + FastAPI | 智能电商导购Agent v4.0</div>
</div>
<script>
let devMode=false;
let eventSource=null;
let currentSid=null;

function toggleDevMode(){
  devMode=!devMode;
  document.getElementById('devPanel').classList.toggle('active',devMode);
  document.getElementById('productsPanel').style.display=devMode?'none':'block';
  document.querySelector('.mode-toggle').textContent=devMode?'退出开发':'开发者模式';
  fetch('/api/dev/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enable:devMode})});
  if(devMode)startMonitorStream();
  else if(eventSource){eventSource.close();eventSource=null;}
}

function addMessage(text,isUser){
  if(!text){console.log('[addMessage] skipped empty text');return;}
  const div=document.createElement('div');
  div.className='message '+(isUser?'user-message':'ai-message');
  div.textContent=text;
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop=999999;
}

function addProductCard(product){
  const div=document.createElement('div');
  div.className='product-card';
  div.innerHTML=`<div class="product-title">${product.title}</div>
    <div class="product-meta">
      <span class="product-price">¥${product.price}</span>
      <span class="product-rating">⭐${product.rating}</span>
    </div>
    <div class="product-tags">${(product.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
  document.getElementById('productsList').appendChild(div);
}

async function sendMessage(){
  const input=document.getElementById('userInput');
  const msg=input.value.trim();
  if(!msg)return;
  input.value='';
  addMessage(msg,true);
  document.getElementById('loading').style.display='block';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,thread_id:currentSid})});
    const data=await res.json();
    document.getElementById('loading').style.display='none';
    addMessage(data.response,false);
    currentSid=data.sid;
    document.getElementById('productsList').innerHTML='';
    if(data.products){
      data.products.forEach(p=>addProductCard(p));
    }
    // diagnose 只在 SSE 监控流显示，不发送到主对话
  }catch(e){
    document.getElementById('loading').style.display='none';
    addMessage('❌ 网络错误，请重试',false);
  }
}

function sendQuick(msg){
  document.getElementById('userInput').value=msg;
  sendMessage();
}

function startMonitorStream(){
  if(eventSource)return;
  eventSource=new EventSource('/api/monitor/stream');
  const log=document.getElementById('monitorLog');
  eventSource.onmessage=e=>{
    const data=JSON.parse(e.data);
    if(data.t==='ping')return;
    const entry=document.createElement('div');
    entry.className='log-entry';
    const ts=new Date().toLocaleTimeString();
    entry.textContent=`[${ts}] ${data.t}: ${JSON.stringify(data).slice(0,200)}`;
    log.appendChild(entry);
    log.scrollTop=999999;
  };
}

async function startBatchTest(count){
  const log=document.getElementById('monitorLog');
  log.innerHTML+='<div class="log-entry">>>> 开始批量测试: '+count+'条</div>';
  document.getElementById('responseContent').textContent='执行中...';
  document.getElementById('analysisContent').textContent='分析中...';
  try{
    const res=await fetch('/api/dev/batch-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count})});
    const data=await res.json();
    log.innerHTML+=`<div class="log-entry">>>> 完成: ${data.ok}成功 ${data.err}失败 平均${data.avg_ms}ms</div>`;
    let respText=`共${data.total}条测试:\n\n`;
    data.reports.forEach((r,i)=>{
      respText+=`[${i+1}] ${r.query}\n意图: ${r.intent_type||'N/A'}\n回复: ${(r.response_full||r.response||'').slice(0,200)}...\n耗时: ${r.total_ms}ms\n---\n`;
    });
    document.getElementById('responseContent').textContent=respText;
    const analysisText = data.analysis !== null && data.analysis !== undefined ? data.analysis : '无分析报告';
    document.getElementById('analysisContent').textContent = analysisText;
  }catch(e){
    log.innerHTML+=`<div class="log-entry">>>> 错误: ${e}</div>`;
    document.getElementById('responseContent').innerHTML='测试失败: '+e;
  }
}

addMessage('👋 你好！我是智能电商导购助手。我可以帮您：\n• 搜索和推荐商品\n• 对比商品价格\n• 查询库存和优惠\n• 解答售后问题\n\n请告诉我您想购买什么？',false);
ProductSearchTool.hot(5).forEach(p=>addProductCard(p));
</script>
</body>
</html>
