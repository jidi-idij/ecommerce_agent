templates:
  - template_id: rec_budget
    intent_type: recommendation
    category: 手机
    structure: "推荐{adj}{category}，预算{price}"
    slots:
      category: ["手机", "智能手机", "拍照手机"]
      adj: ["学生党", "性价比高的", "适合老人的", "女生用的"]
    free_slots: ["price"]

  - template_id: compare_brand
    intent_type: price_compare
    category: 手机
    structure: "{brand1}和{brand2}哪个好"
    slots:
      brand1: ["iPhone 15", "华为Mate60", "小米14"]
      brand2: ["华为Mate60", "小米14", "OPPO Find X7"]
    free_slots: []

  - template_id: search_extreme
    intent_type: product_search
    category: 通用
    structure: "你们这最{extreme}的{category}"
    slots:
      extreme: ["贵", "便宜", "受欢迎", "畅销"]
      category: ["产品", "耳机", "手机", "平板"]
    free_slots: []

  - template_id: scene_gift
    intent_type: recommendation
    category: 通用
    structure: "适合送{recipient}的{category}"
    slots:
      recipient: ["女朋友", "男朋友", "父母", "孩子", "学生"]
      category: ["礼物", "手机", "耳机", "手表"]
    free_slots: []

  - template_id: after_sales
    intent_type: after_sales
    category: 通用
    structure: "怎么{action}"
    slots:
      action: ["退货", "换货", "维修", "申请售后", "联系客服"]
    free_slots: []

  - template_id: spec_search
    intent_type: product_search
    category: 手机
    structure: "{feature}好的{category}{price}"
    slots:
      feature: ["拍照", "续航", "游戏", "办公"]
      category: ["手机", "笔记本", "平板"]
      price: ["5000左右", "2000元以下", "1000-3000元"]
    free_slots: []

  - template_id: chat_greeting
    intent_type: general
    category: 通用
    structure: "{greeting}"
    slots:
      greeting: ["你好", "在吗", "哈喽", "请问有人吗"]
    free_slots: []

  - template_id: promo_search
    intent_type: product_search
    category: 通用
    structure: "有什么{promo_type}"
    slots:
      promo_type: ["优惠活动", "打折", "满减", "优惠券", "学生优惠"]
    free_slots: []

  - template_id: ranking
    intent_type: product_search
    category: 通用
    structure: "{metric}最高的{category}"
    slots:
      metric: ["销量", "评分", "性价比", "续航"]
      category: ["相机", "游戏机", "笔记本", "耳机"]
    free_slots: []

  - template_id: brand_search
    intent_type: product_search
    category: 通用
    structure: "{brand}的{category}"
    slots:
      brand: ["华为", "苹果", "小米", "索尼", "三星"]
      category: ["手机", "耳机", "手表", "笔记本"]
    free_slots: []
